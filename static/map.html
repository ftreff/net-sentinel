<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Net Sentinel Map</title>
  <meta name="description" content="Net Sentinel interactive map of intrusion attempts and network events." />

  <!-- Leaflet core CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Stats box overlay (bottom-left) -->
  <div id="stats-box" aria-live="polite" role="region" aria-label="Statistics">
    <div class="stats-header">
      <span class="stats-title">Statistics</span>
      <button id="stats-toggle" aria-pressed="false" aria-label="Minimize statistics">−</button>
    </div>

    <div class="stats-content">
      <div id="stats-body" class="stats-bar">
        <div class="stats-summary" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <strong>DROPPED:</strong> <span id="stat-drop-count">—</span>
            <span style="color: rgba(255,255,255,0.35); margin: 0 6px;">/</span>
            <strong>ACCEPTED:</strong> <span id="stat-accept-count">—</span>
          </div>

          <!-- Right side: Top 100 button (replaces the old Accept: # area) -->
          <div>
            <button id="open-top100" title="Open Top 100 Stats Page" style="background:linear-gradient(180deg, rgba(0,255,204,0.06), rgba(0,255,204,0.03)); color:#000; border:1px solid rgba(0,255,204,0.12); padding:6px 10px; border-radius:4px; font-weight:700; cursor:pointer;">
              Top 100 Stats Page
            </button>
          </div>
         <!-- <div><button id="stats-refresh" title="Refresh statistics">Refresh</button></div> -->
        </div>

        <hr>

        <div class="stats-columns">
          <div class="stats-col countries">
            <h4>Top 50 Countries</h4>
            <ol id="stat-top-countries">
              <li>—</li>
            </ol>
          </div>

          <div class="stats-col ports">
            <h4>Top 50 Ports</h4>
            <ol id="stat-top-ports">
              <li>—</li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet core JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <!-- Stats toggle script -->
  <script>
  (function () {
    const STORAGE_KEY = "net_sentinel_stats_minimized";

    function qs(selector, root = document) {
      return root.querySelector(selector);
    }

    function applyState(box, minimized) {
      if (!box) return;
      const btn = qs("#stats-toggle", box);
      if (minimized) {
        box.classList.add("minimized");
        if (btn) {
          btn.textContent = "+";
          btn.setAttribute("aria-pressed", "true");
          btn.setAttribute("aria-label", "Restore statistics");
        }
      } else {
        box.classList.remove("minimized");
        if (btn) {
          btn.textContent = "−";
          btn.setAttribute("aria-pressed", "false");
          btn.setAttribute("aria-label", "Minimize statistics");
        }
      }
    }

    function initToggle() {
      const box = document.getElementById("stats-box");
      if (!box) return;

      // Restore saved state
      const saved = localStorage.getItem(STORAGE_KEY);
      const minimized = saved === "1";
      applyState(box, minimized);

      const btn = qs("#stats-toggle", box);
      if (!btn) return;

      btn.addEventListener("click", function (ev) {
        ev.preventDefault();
        const isMin = box.classList.contains("minimized");
        const newState = !isMin;
        applyState(box, newState);
        localStorage.setItem(STORAGE_KEY, newState ? "1" : "0");
      });

      // Hook up refresh button to dispatch an event dashboard.js listens for
      const refreshBtn = qs("#stats-refresh", box);
      if (refreshBtn) {
        refreshBtn.addEventListener("click", function () {
          window.dispatchEvent(new CustomEvent("net_sentinel:refresh_stats"));
        });
      }

      // Top 100 button: open the Top 100 page in a new tab/window
      const topBtn = qs("#open-top100", box);
      if (topBtn) {
        topBtn.addEventListener("click", function (ev) {
          ev.preventDefault();
          // Adjust path if you serve the Top 100 page at a different route or static path
          window.open('/top100', '_blank', 'noopener,noreferrer');
        });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initToggle);
    } else {
      initToggle();
    }
  })();
  </script>

  <!-- Dashboard logic -->
  <script src="dashboard.js"></script>
</body>
</html>
